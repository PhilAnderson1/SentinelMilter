# SentinelMilter: https://github.com/PhilAnderson1/SentinelMilter
#
# This example configuration and the supplied detection prompt have been tuned
# and tested with Qwen3.6-35B-A3B. Other LLMs may require adjustments to the
# prompt, rejection threshold, timeout, or reasoning settings.
#
# To use with OpenRouter, create an account and API key at:
# https://openrouter.ai/

# Operation mode: monitor or enforce.
# monitor logs proposed decisions but always accepts mail.
# enforce can reject spam/scam decisions according to policy below.
mode: monitor

milter:
  # Listener address. The default is a loopback-only TCP listener. Change the
  # port if it conflicts locally; do not expose it on a public interface.
  # A Unix socket may be used instead: unix:/run/sentinelmilter/sentinelmilter.sock
  socket: tcp:127.0.0.1:8895

  # Idle/protocol I/O timeout. Uses Go duration syntax, for example 30s,
  # 2m, or 1m30s. During analysis SentinelMilter automatically uses this value
  # or ai.timeout plus a response-writing margin, whichever is longer.
  timeout: 1m

  # Maximum message body bytes retained for analysis; positive integer.
  # Larger messages are truncated and the decision log records truncated=true.
  max_message_size: 2097152

  # Maximum number of simultaneous AI analyses; positive integer.
  max_concurrent: 8

ai:
  # Full OpenRouter- or llama.cpp-compatible chat-completions URL.
  # The endpoint must implement the v1/chat/completions request and response format.
  endpoint: https://openrouter.ai/api/v1/chat/completions

  # API credential. For a local endpoint that does not authenticate, a
  # non-empty placeholder is still required and is sent as a Bearer token.
  api_key: "replace-with-your-openrouter-key"

  # Alternatively, set api_key: "" and name an environment variable here.
  # The variable must be available to the SentinelMilter service process.
  # api_key_env: OPENROUTER_API_KEY

  # Model identifier accepted by the endpoint. OpenRouter commonly uses
  # provider/model names; llama.cpp may use its configured model name or path.
  model: qwen/qwen3.6-35b-a3b

  # Boolean: true or false. When true, send both llama.cpp's
  # thinking_budget_tokens: 0 and OpenRouter's reasoning.effort: none.
  disable_thinking: true

  # Absolute path to the system prompt used for every classification.
  prompt_file: /etc/sentinelmilter/detection-prompt.txt

  # Maximum duration of one AI request, using Go duration syntax. Must be > 0.
  timeout: 45s

  # Maximum number of message-text characters supplied to the AI; positive
  # integer. This is separate from milter.max_message_size, which is in bytes.
  max_body_chars: 50000

  # Image-analysis mode: off, fallback, or always. fallback sends qualifying
  # CID-referenced inline images only when the extracted visible body contains
  # fewer than vision_min_text_chars characters. The configured model and
  # endpoint must support image_url content for fallback or always mode.
  vision_mode: fallback
  vision_min_text_chars: 200

  # Vision safety and cost limits. SentinelMilter never fetches remote images.
  # It accepts at most this many locally embedded JPEG, PNG, or GIF images;
  # each image must be within both the decoded-byte and pixel limits.
  max_images: 2
  max_image_bytes: 2097152
  max_image_pixels: 12000000

  # Optional OpenRouter attribution headers. Empty strings disable them.
  # site_url is sent as HTTP-Referer; app_name is sent as X-Title.
  site_url: https://github.com/PhilAnderson1/SentinelMilter
  app_name: SentinelMilter

policy:
  # Confidence threshold from 0 through 1, inclusive. Used only when the AI
  # classification is spam or scam; legitimate and uncertain are accepted.
  reject_score: 0.9

  # Action on endpoint timeouts, connection failures, HTTP errors, or invalid
  # AI responses: accept or tempfail. tempfail applies only in enforce mode;
  # monitor mode always accepts.
  ai_error_action: accept

  # Text returned with SMTP status 550 5.7.1 when a message is rejected.
  # Keep this on one line; NUL and newline characters are removed.
  reject_message: Message rejected as suspected spam or fraud

  # After an AI-classified message is rejected in enforce mode, add the sending
  # IP address to a temporary blacklist for the configured time. Further
  # transactions from that IP are rejected at MAIL FROM without another AI
  # request. Uses Go duration syntax; 0s disables this feature. The blacklist
  # is held in memory and cleared when SentinelMilter restarts.
  rejected_ip_block_duration: 60m

  # Boolean: when true, each rejected delivery attempt from a blacklisted IP
  # restarts its configured blacklist time. The safer default is false because
  # repeated traffic could otherwise keep a shared sending IP blocked indefinitely.
  rejected_ip_refresh_on_attempt: false

  # Maximum cached sending IPs; positive integer. When full, the entry expiring
  # soonest is removed before a new IP is added.
  rejected_ip_cache_size: 10000

  # Exact IP addresses or CIDR ranges that must never be added to the rejection
  # cache. Add trusted relays and shared forwarding services here as needed.
  rejected_ip_allowlist:
    - 127.0.0.0/8
    - ::1/128

  # Reverse-DNS domains whose sending IPs must never be blacklisted. An entry
  # matches the domain itself and all subdomains: outlook.com therefore matches
  # outbound.protection.outlook.com. SentinelMilter also resolves the hostname
  # forward and requires it to contain the connecting IP, preventing a forged
  # PTR record from bypassing the blacklist.
  rejected_ip_domain_allowlist:
    - google.com
    - outlook.com
    - yahoo.com
    - yahoo.net
    - me.com
    - icloud.com
    - messagingengine.com
    - protonmail.ch
    - zoho.com
    - zohomail.com
    - gmx.net
    - web.de

  # Maximum time allowed for the reverse and forward DNS checks. This lookup is
  # performed only after an AI-classified message has already been rejected.
  rejected_ip_dns_timeout: 5s

logging:
  # Minimum log level: debug, info, warn, or error.
  level: info

  # Boolean: include or omit the Subject header in successful decision logs.
  # Message bodies are never logged.
  include_subject: true
