# SentinelMilter: https://github.com/PhilAnderson1/SentinelMilter
#
# This example configuration and the supplied detection prompt have been tuned
# and tested with Qwen3.6-35B-A3B. Other LLMs may require adjustments to the
# prompt, rejection threshold, timeout, or reasoning settings.
#
# To use with OpenRouter, create an account and API key at:
# https://openrouter.ai/

# Operation mode: monitor or enforce.
# monitor logs proposed decisions but always accepts mail.
# enforce can reject spam/scam decisions according to policy below.
mode: monitor

milter:
  # Listener address. The default is a loopback-only TCP listener. Change the
  # port if it conflicts locally; do not expose it on a public interface.
  # A Unix socket may be used instead: unix:/run/sentinelmilter/sentinelmilter.sock
  socket: tcp:127.0.0.1:8895

  # Milter protocol I/O timeout. Uses Go duration syntax, for example 30s,
  # 2m, or 1m30s.
  timeout: 1m

  # Maximum time for DNS lookups (DNS evidence is used by the AI to classify emails).
  connection_dns_timeout: 2s

  # Maximum message body bytes retained for analysis; positive integer.
  # Larger messages are truncated and the decision log records truncated=true.
  max_message_size: 2097152

  # Maximum number of simultaneous AI analyses; positive integer.
  max_concurrent: 8

ai:
  # Full OpenRouter- or llama.cpp-compatible chat-completions URL.
  # The endpoint must implement the v1/chat/completions request and response format.
  endpoint: https://openrouter.ai/api/v1/chat/completions

  # API credential. For a local endpoint that does not authenticate, a
  # non-empty placeholder is still required and is sent as a Bearer token.
  api_key: "replace-with-your-openrouter-key"

  # Alternatively, set api_key: "" and name an environment variable here.
  # The variable must be available to the SentinelMilter service process.
  # api_key_env: OPENROUTER_API_KEY

  # Model identifier accepted by the endpoint. OpenRouter commonly uses
  # provider/model names; llama.cpp may use its configured model name or path.
  model: qwen/qwen3.6-35b-a3b

  # Boolean: true or false. When true, send both llama.cpp- and
  # OpenRouter-compatible controls to disable model reasoning.
  disable_thinking: true

  # Absolute path to the system prompt used for every classification.
  prompt_file: /etc/sentinelmilter/detection-prompt.txt

  # Maximum duration of one AI request, using Go duration syntax. Must be > 0.
  timeout: 45s

  # Maximum number of message-text characters supplied to the AI; positive
  # integer. This is separate from milter.max_message_size, which is in bytes.
  max_body_chars: 50000

  # Image analysis detects scams concealed in images to evade text-based filtering.
  # Modes: off, fallback, or always. fallback analyses inline images only when
  # insufficient body text is available. Requires a vision-capable model.
  vision_mode: fallback
  vision_min_text_chars: 200

  # Limits the number, file size, and dimensions of embedded images sent for
  # analysis. Remote images are never downloaded.
  max_images: 2
  max_image_bytes: 2097152
  max_image_pixels: 12000000

  # Optional OpenRouter attribution headers. Empty strings disable them.
  # site_url is sent as HTTP-Referer; app_name is sent as X-Title.
  site_url: https://github.com/PhilAnderson1/SentinelMilter
  app_name: SentinelMilter

policy:
  # Reject spam or scam classifications at or above this confidence score (0–1).
  reject_score: 0.9

  # Scan email sent by authenticated users. Disable to bypass AI analysis of
  # outbound mail.
  scan_authenticated: true

  # Action when AI analysis fails: accept or tempfail. tempfail asks the sending
  # mail server to retry later. Monitor mode always accepts.
  ai_error_action: accept

  # Text returned with SMTP status 550 5.7.1 when a message is rejected.
  # Keep this on one line; NUL and newline characters are removed.
  reject_message: Message rejected as suspected spam or fraud

  # Temporarily blacklist the sending IP after rejecting an email, avoiding further
  # AI requests. Uses Go duration syntax; 0s disables.
  rejected_ip_block_duration: 60m

  # Rejections within the rolling window required for longer IP blacklisting.
  # Set to 0 to disable escalation.
  rejected_ip_repeat_threshold: 3
  rejected_ip_repeat_window: 720h
  rejected_ip_repeat_block_duration: 720h

  # Extend the repeat-offender blacklisting timeout after each delivery attempt.
  rejected_ip_repeat_refresh_on_attempt: true

  # Legitimate emails required to remove one IP strike. Set to 0 to disable.
  rejected_ip_legitimate_messages_per_strike: 3

  # Maximum stored sending IP records; positive integer.
  rejected_ip_cache_size: 10000

  # Persistent reputation state. Strikes and active blocks survive restarts.
  rejected_ip_state_file: /var/lib/sentinelmilter/rejected-ip-state.json

  # Exact IP addresses or CIDR ranges that must never be added to the rejection
  # cache. Add trusted relays and shared forwarding services here as needed.
  rejected_ip_allowlist:
    - 127.0.0.0/8
    - ::1/128

  # Never blacklist IPs with forward-confirmed reverse DNS matching these domains
  # or their subdomains.
  rejected_ip_domain_allowlist:
    - google.com
    - outlook.com
    - yahoo.com
    - yahoo.net
    - me.com
    - icloud.com
    - messagingengine.com
    - protonmail.ch
    - zoho.com
    - zohomail.com
    - gmx.net
    - web.de

correspondent_allowlist:
  # Add recipients of accepted email sent by authenticated users to the
  # correspondent allowlist.
  learn_authenticated_recipients: true

  # Automatically add consistently legitimate inbound senders to the allowlist.
  learn_legitimate_senders: true

  # Number of legitimate emails required to allowlist an inbound sender, and the
  # minimum confidence score each email must meet.
  legitimate_sender_min_messages: 5
  legitimate_sender_min_score: 0.99

  # Boolean: require trusted aligned DKIM before an inbound legitimate result
  # contributes toward automatic whitelisting.
  legitimate_sender_require_dkim: true

  # Boolean: use saved relationships when assessing inbound mail. When false,
  # the database may still be populated for inspection without affecting mail.
  use_allowlist: true

  # per_sender keeps each local user's correspondents separate. global uses
  # known correspondents from all local users.
  scope: per_sender

  # For per_sender scope, require all envelope recipients to recognise the
  # correspondent, or any to require only one. all is safer for shared servers.
  recipient_match: all

  # Boolean: bypass AI email scanning when recipient_match and any configured
  # authentication requirements are satisfied. When false, the relationship
  # is supplied to the AI as supporting evidence.
  bypass_ai: true

  # Require trusted, aligned DKIM authentication before a known correspondent can
  # bypass AI. Disable to permit bypass without authentication.
  require_dkim_for_bypass: true

  # Runtime-generated state file and maximum number of retained relationships.
  file: /var/lib/sentinelmilter/correspondent-allowlist.json
  max_entries: 10000

  # Remove relationships with no qualifying inbound or outbound activity for
  # this duration. 0s disables age-based expiry.
  stale_after: 8760h

  # Minimum interval between saving activity updates for each relationship.
  # Set to 0s to save every qualifying activity.
  activity_update_interval: 24h

  # Identifies Authentication-Results headers added by your own mail server, allowing
  # SentinelMilter to trust their DKIM results. $mta_hostname automatically uses
  # your MTA hostname. Your MTA must remove forged inbound Authentication-Results
  # headers claiming this hostname.
  trusted_authserv_ids:
    - "$mta_hostname"

logging:
  # Minimum log level: debug, info, warn, or error.
  level: info

  # Include email subjects in successful decision logs.
  include_subject: true

  # Log complete AI input for troubleshooting. This may expose sensitive email
  # content, so enable it only temporarily. Image data is never logged.
  include_ai_input: false
